apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-qa-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-qa-api }
  template:
    metadata:
      labels: { app: ai-qa-api }
    spec:
      containers:
        - name: api
          image: ai-qa-platform:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: ai-qa-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-qa-api
spec:
  selector: { app: ai-qa-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-qa-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-qa-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
