[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-qa-platform"
version = "0.1.0"
description = "Production-style AI question answering API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.4,<3",
  "redis>=5,<6", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "openai>=1.40,<3",
  "tenacity>=9,<10", "prometheus-client>=0.20,<1", "httpx>=0.27,<1", "email-validator>=2,<3",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
